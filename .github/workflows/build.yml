name: build

# Cloud build for every client except iOS: android / windows / linux / macos.
#
# Secrets-free by design:
# - Android falls back to the debug keystore (see android/app/build.gradle.kts),
#   so the produced APKs install fine but are not publishable to stores.
# - macOS builds are ad-hoc signed (Local.xcconfig with CODE_SIGN_IDENTITY = -),
#   so the dmg runs locally / via right-click but is not notarized.
#
# NOTE: tags are handled by release.yml — do NOT add a `tags` filter next to
# `branches` here: when both are defined the push event must match BOTH
# (branches AND tags), which no push ever does.
on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
          - platform: windows
            os: windows-latest
            arch: amd64
          - platform: linux
            os: ubuntu-24.04
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: arm64
          - platform: windows
            os: windows-11-arm
            arch: arm64
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Setup Rust for Windows ARM64
        if: startsWith(matrix.os, 'windows-11-arm')
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: |
            core/go.sum

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter (ARM)
        if: startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')
        uses: subosito/flutter-action@v2
        with:
          channel: "master"
          cache: true

      - name: Setup Flutter
        if: ${{ !(startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')) }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - run: flutter --version

      # Pin to ubuntu-24.04: the ubuntu-26 image dropped the whole Android SDK
      # (and android-actions/setup-android fails there too). The 24.04 image
      # ships the SDK + NDK preinstalled with licenses accepted; gradle
      # auto-installs its pinned ndkVersion (28.0.13004108) via sdkmanager.
      - name: Resolve Android NDK
        if: matrix.platform == 'android'
        run: |
          NDK_DIR=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk"/* 2>/dev/null | sort -V | tail -n1)
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Resolved ANDROID_NDK=$NDK_DIR"

      - name: Get Flutter Dependency
        run: flutter pub get

      - name: Setup Inno Setup
        if: matrix.platform == 'windows'
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure npm prefix (macos)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      - name: Disable macOS code signing (no Apple certificate in this repo)
        if: matrix.platform == 'macos'
        run: |
          cat > macos/Runner/Configs/Local.xcconfig << EOF
          CODE_SIGN_IDENTITY =
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          EOF
          xattr -cr macos 2>/dev/null || true
          echo "macOS code signing disabled (unsigned dmg)"

      - name: Build
        shell: bash
        run: |
          dart setup.dart ${{ matrix.platform }} ${{ matrix.arch && format('--arch {0}', matrix.arch) }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Probe log tail
        if: failure()
        shell: bash
        run: |
          set +e +o pipefail
          if [ ! -f build.log ]; then echo "::error::no build.log"; exit 0; fi
          tail -n 10 build.log | while IFS= read -r line; do echo "::error::TAIL ${line:0:440}"; done

      - name: Probe gradle/xcode context
        if: failure()
        shell: bash
        run: |
          set +e +o pipefail
          [ -f build.log ] || exit 0
          {
            N=$(grep -n "FAILURE: Build failed" build.log | head -1 | cut -d: -f1)
            [ -n "$N" ] && sed -n "${N},$((N+11))p" build.log
            X=$(grep -n "BUILD FAILED" build.log | head -1 | cut -d: -f1)
            if [ -n "$X" ]; then F=$((X-12)); [ "$F" -lt 1 ] && F=1; sed -n "${F},${X}p" build.log; fi
          } 2>/dev/null | tail -n 9 | while IFS= read -r line; do echo "::error::CTX ${line:0:440}"; done

      - name: Probe first failing command context
        if: failure()
        shell: bash
        run: |
          set +e +o pipefail
          [ -f build.log ] || exit 0
          M=$(grep -n "MSB3073" build.log | head -1 | cut -d: -f1)
          if [ -n "$M" ]; then
            S=$((M-20)); [ "$S" -lt 1 ] && S=1
            sed -n "${S},${M}p" build.log 2>/dev/null | tail -n 8 | while IFS= read -r line; do echo "::error::W ${line:0:440}"; done
          fi

      - name: Probe matched error lines
        if: failure()
        shell: bash
        run: |
          set +e +o pipefail
          [ -f build.log ] || exit 0
          grep -inE "CMake Error|error MSB|error LNK|error C[0-9]|error:|fatal error|cannot find|No such file|npm ERR|ERR!|EACCES|EPERM|Unable to" build.log 2>/dev/null \
            | grep -viE "ld: warning|warning:|Pods\.xcodeproj|Microsoft\.CppCommon|errorlevel|:VCEnd|asynchronous suspension|setup\.dart|Build\.exec|command_runner" \
            | tail -n 10 | while IFS= read -r line; do echo "::error::${line:0:440}"; done

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true
