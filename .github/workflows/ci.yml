name: ci

# Compile check for everyday changes: Android only, no signing secrets, no
# release. build.yaml stays responsible for tagged multi-platform releases —
# it needs the keystore and Apple certs, which a fresh checkout doesn't have.
# Signing here falls back to the debug keystore (see android/app/build.gradle.kts),
# so the produced APK installs fine for testing but isn't publishable.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "core/**"
      - "setup.dart"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ci.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: core/go.sum

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      # Pin to ubuntu-24.04: the ubuntu-26 image dropped the Android SDK and
      # android-actions/setup-android fails there. The 24.04 image ships the
      # SDK + NDK preinstalled with licenses accepted.
      - name: Resolve Android NDK
        run: |
          NDK_DIR=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk"/* 2>/dev/null | sort -V | tail -n1)
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Resolved ANDROID_NDK=$NDK_DIR"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android
        shell: bash
        run: |
          dart setup.dart android 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          if [ -f build.log ]; then
            grep -inE "error( |:)|failed|failure|exception|cannot|unable|not found|undefined" build.log | tail -n 10 | while IFS= read -r line; do
              echo "::error::${line:0:450}"
            done
            tail -n 4 build.log | while IFS= read -r line; do
              echo "::error::TAIL ${line:0:450}"
            done
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: ./dist
          overwrite: true
