name: ci

# Compile check for everyday changes: Android only, no signing secrets, no
# release. build.yaml stays responsible for tagged multi-platform releases —
# it needs the keystore and Apple certs, which a fresh checkout doesn't have.
# Signing here falls back to the debug keystore (see android/app/build.gradle.kts),
# so the produced APK installs fine for testing but isn't publishable.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "core/**"
      - "setup.dart"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ci.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: core/go.sum

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      # The ubuntu-26 runner image no longer ships the Android NDK and
      # setup.dart hard-requires ANDROID_NDK (assert). Install the exact NDK
      # version pinned in android/app/build.gradle.kts.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;28.0.13004108" > /dev/null
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/28.0.13004108" >> "$GITHUB_ENV"
          test -f "$ANDROID_NDK/source.properties" && echo "NDK installed at $ANDROID_NDK"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android
        shell: bash
        run: |
          dart setup.dart android 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          if [ -f build.log ]; then
            grep -inE "error( |:)|failed|failure|exception|cannot|unable|not found|undefined" build.log | tail -n 10 | while IFS= read -r line; do
              echo "::error::${line:0:450}"
            done
            tail -n 4 build.log | while IFS= read -r line; do
              echo "::error::TAIL ${line:0:450}"
            done
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: ./dist
          overwrite: true
