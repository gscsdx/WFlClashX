name: release

# Tag-triggered release build: push a v* tag and every client artifact is
# attached to an automatically created GitHub Release.
#   git tag v0.4.2 && git push origin v0.4.2        -> stable release
#   git tag v0.4.2-pre.1 && git push origin ...     -> pre-release
# Build steps mirror build.yml (see its header for the secrets-free notes).
on:
  push:
    tags:
      - "v*"

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
          - platform: windows
            os: windows-latest
            arch: amd64
          - platform: linux
            os: ubuntu-24.04
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: arm64
          - platform: windows
            os: windows-11-arm
            arch: arm64
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Setup Rust for Windows ARM64
        if: startsWith(matrix.os, 'windows-11-arm')
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: |
            core/go.sum

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter (ARM)
        if: startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')
        uses: subosito/flutter-action@v2
        with:
          channel: "master"
          cache: true

      - name: Setup Flutter
        if: ${{ !(startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')) }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - run: flutter --version

      # Pin to ubuntu-24.04 (android): the ubuntu-26 image dropped the whole
      # Android SDK. The 24.04 image ships SDK + NDK preinstalled with licenses
      # accepted; gradle auto-installs its pinned ndkVersion via sdkmanager.
      - name: Resolve Android NDK
        if: matrix.platform == 'android'
        run: |
          NDK_DIR=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk"/* 2>/dev/null | sort -V | tail -n1)
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Resolved ANDROID_NDK=$NDK_DIR"

      - name: Get Flutter Dependency
        run: flutter pub get

      - name: Setup Inno Setup
        if: matrix.platform == 'windows'
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure npm prefix (macos)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      - name: Disable macOS code signing (no Apple certificate in this repo)
        if: matrix.platform == 'macos'
        run: |
          cat > macos/Runner/Configs/Local.xcconfig << EOF
          CODE_SIGN_IDENTITY =
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          EOF
          xattr -cr macos 2>/dev/null || true
          echo "macOS code signing disabled (unsigned dmg)"

      - name: Build
        shell: bash
        run: |
          dart setup.dart ${{ matrix.platform }} ${{ matrix.arch && format('--arch {0}', matrix.arch) }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Probe log tail
        if: failure()
        shell: bash
        run: |
          set +e +o pipefail
          if [ ! -f build.log ]; then echo "::error::no build.log"; exit 0; fi
          tail -n 10 build.log | while IFS= read -r line; do echo "::error::TAIL ${line:0:440}"; done

      - name: Probe gradle/xcode context
        if: failure()
        shell: bash
        run: |
          set +e +o pipefail
          [ -f build.log ] || exit 0
          {
            N=$(grep -n "FAILURE: Build failed" build.log | head -1 | cut -d: -f1)
            [ -n "$N" ] && sed -n "${N},$((N+11))p" build.log
            X=$(grep -n "BUILD FAILED" build.log | head -1 | cut -d: -f1)
            if [ -n "$X" ]; then F=$((X-12)); [ "$F" -lt 1 ] && F=1; sed -n "${F},${X}p" build.log; fi
          } 2>/dev/null | tail -n 9 | while IFS= read -r line; do echo "::error::CTX ${line:0:440}"; done

      - name: Probe first failing command context
        if: failure()
        shell: bash
        run: |
          set +e +o pipefail
          [ -f build.log ] || exit 0
          M=$(grep -n "MSB3073" build.log | head -1 | cut -d: -f1)
          if [ -n "$M" ]; then
            S=$((M-20)); [ "$S" -lt 1 ] && S=1
            sed -n "${S},${M}p" build.log 2>/dev/null | tail -n 8 | while IFS= read -r line; do echo "::error::W ${line:0:440}"; done
          fi

      - name: Probe matched error lines
        if: failure()
        shell: bash
        run: |
          set +e +o pipefail
          [ -f build.log ] || exit 0
          grep -inE "CMake Error|error MSB|error LNK|error C[0-9]|error:|fatal error|cannot find|No such file|npm ERR|ERR!|EACCES|EPERM|Unable to" build.log 2>/dev/null \
            | grep -viE "ld: warning|warning:|Pods\.xcodeproj|Microsoft\.CppCommon|errorlevel|:VCEnd|asynchronous suspension|setup\.dart|Build\.exec|command_runner" \
            | tail -n 10 | while IFS= read -r line; do echo "::error::${line:0:440}"; done

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  release:
    needs: [build]
    # Publish whatever was built: a single platform failing (or a macOS job
    # being queue-cancelled) must not swallow the whole release.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
