name: release

# Tag-triggered release build: push a v* tag and every client artifact is
# attached to an automatically created GitHub Release.
#   git tag v0.4.2 && git push origin v0.4.2        -> stable release
#   git tag v0.4.2-pre.1 && git push origin ...     -> pre-release
# Build steps mirror build.yml (see its header for the secrets-free notes).
on:
  push:
    tags:
      - "v*"

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
          - platform: windows
            os: windows-latest
            arch: amd64
          - platform: linux
            os: ubuntu-24.04
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: arm64
          - platform: windows
            os: windows-11-arm
            arch: arm64
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Setup Rust for Windows ARM64
        if: startsWith(matrix.os, 'windows-11-arm')
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: |
            core/go.sum

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter (ARM)
        if: startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')
        uses: subosito/flutter-action@v2
        with:
          channel: "master"
          cache: true

      - name: Setup Flutter
        if: ${{ !(startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')) }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - run: flutter --version

      # Pin to ubuntu-24.04 (android): the ubuntu-26 image dropped the whole
      # Android SDK. The 24.04 image ships SDK + NDK preinstalled with licenses
      # accepted; gradle auto-installs its pinned ndkVersion via sdkmanager.
      - name: Resolve Android NDK
        if: matrix.platform == 'android'
        run: |
          NDK_DIR=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk"/* 2>/dev/null | sort -V | tail -n1)
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Resolved ANDROID_NDK=$NDK_DIR"

      # gradle pins ndkVersion 28.0.13004108; auto-installing it fails unless the
      # matching SDK license is accepted, so accept everything and preinstall.
      - name: Accept SDK licenses & install pinned NDK
        if: matrix.platform == 'android'
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;28.0.13004108" > /dev/null

      - name: Get Flutter Dependency
        run: flutter pub get

      - name: Setup Inno Setup
        if: matrix.platform == 'windows'
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Disable macOS code signing (no Apple certificate in this repo)
        if: matrix.platform == 'macos'
        run: |
          cat > macos/Runner/Configs/Local.xcconfig << EOF
          CODE_SIGN_IDENTITY =
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          EOF
          xattr -cr macos 2>/dev/null || true
          echo "macOS code signing disabled (unsigned dmg)"

      - name: Build
        shell: bash
        run: |
          dart setup.dart ${{ matrix.platform }} ${{ matrix.arch && format('--arch {0}', matrix.arch) }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          if [ -f build.log ]; then
            N=$(grep -n "FAILURE: Build failed" build.log | head -1 | cut -d: -f1)
            if [ -n "$N" ]; then
              sed -n "${N},$((N+12))p" build.log | while IFS= read -r line; do
                echo "::error::CTX ${line:0:450}"
              done
            fi
            grep -inE "error( |:)|failed|failure|exception|cannot|unable|not found|not accepted|licenses|undefined" build.log | tail -n 8 | while IFS= read -r line; do
              echo "::error::${line:0:450}"
            done
          fi

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
